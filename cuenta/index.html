<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConTAGme — Crea tu cuenta gratis</title>
<meta name="description" content="Crea tu cuenta gratis de ConTAGme.">
<link rel="icon" type="image/webp" href="/logo.webp">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#f5f0e6; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2rem 1.2rem 3rem; }
  .logo { width:96px; height:96px; object-fit:contain; }
  h1.word { font-size:1.9rem; font-weight:800; letter-spacing:.06em; margin-top:.4rem; }
  h1.word .tag { color:#d4a72c; }
  .card { background:#141414; border:1px solid #2a2a2a; border-radius:18px; max-width:520px; width:100%; margin-top:1.6rem; padding:1.5rem; }
  .found { font-size:.75rem; letter-spacing:.3em; text-transform:uppercase; color:#8d8574; text-align:center; }
  .desc { text-align:center; font-size:1.35rem; font-weight:700; margin-top:.5rem; }
  .panel p { color:#ddd5c0; font-size:.95rem; line-height:1.5; margin-top:.8rem; text-align:center; }
  label { display:block; margin-top:1.1rem; font-size:.85rem; color:#cbbf9f; }
  input[type=email] { width:100%; margin-top:.4rem; background:#0a0a0a; border:1px solid #333; border-radius:10px; color:#f5f0e6; padding:.85rem; font-family:inherit; font-size:1rem; }
  .send { width:100%; margin-top:1.1rem; padding:.9rem; border:none; border-radius:12px; background:#d4a72c; color:#0a0a0a; font-weight:800; cursor:pointer; font-size:1rem; }
  .send:disabled { opacity:.55; cursor:default; }
  .status { display:none; margin-top:1rem; text-align:center; font-size:.92rem; line-height:1.5; }
  .status.err { color:#e08a8a; }
  .status.ok { color:#9fb98a; }
  .back { display:block; text-align:center; margin-top:1.4rem; color:#d4a72c; text-decoration:none; font-size:.92rem; }
  footer { margin-top:2rem; font-size:.75rem; color:#6b6558; text-align:center; }
  .proto { color:#d4a72c; }
</style>
</head>
<body>
  <img class="logo" src="/logo.webp" alt="ConTAGme">
  <h1 class="word">Con<span class="tag">TAG</span>me</h1>
  <div class="card">
    <div class="found">Cuenta gratis</div>
    <div class="desc">✨ Crea tu cuenta gratis</div>
    <div class="panel">
      <p>Estamos abriendo las cuentas poco a poco, en orden de llegada. Déjanos tu correo y serás de los primeros en crear tu propia etiqueta cuando abra el registro.</p>
      <label for="email">Tu correo electrónico</label>
      <input id="email" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
      <input id="web" type="text" style="display:none" tabindex="-1" autocomplete="off">
      <button class="send" id="btn" onclick="registrar()">Quiero mi cuenta gratis</button>
      <div class="status" id="status"></div>
      <a class="back" href="/">← Volver al inicio</a>
    </div>
  </div>
  <footer><span class="proto">BOCETO / PROTOTIPO</span> · ConTAGme · © 2026</footer>
<script>
  var API_BASE = 'https://contagme-api.jorgeandresvidalpena.workers.dev';

  function estado(txt, tipo) {
    var s = document.getElementById('status');
    s.textContent = txt;
    s.className = 'status ' + (tipo || '');
    s.style.display = 'block';
  }

  async function registrar() {
    var email = document.getElementById('email').value.trim();
    var btn = document.getElementById('btn');
    if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 0) {
      estado('Escribe un correo válido, por favor.', 'err');
      return;
    }
    btn.disabled = true;
    estado('Guardando tu lugar…', '');
    var r;
    try {
      r = await fetch(API_BASE + '/api/mensaje', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          codigo: 'REGISTRO',
          texto: 'Solicitud de cuenta gratis desde la web — correo: ' + email,
          respuesta: email,
          web: document.getElementById('web').value
        })
      });
    } catch (e) {
      btn.disabled = false;
      estado('No se pudo contactar el servidor. Revisa tu conexión e inténtalo de nuevo.', 'err');
      return;
    }
    if (r.ok) {
      estado('✔ ¡Ya estás en la lista! Te escribiremos a ' + email + ' en cuanto puedas crear tu cuenta.', 'ok');
      document.getElementById('email').value = '';
    } else {
      btn.disabled = false;
      estado('El servidor no aceptó la solicitud (' + r.status + '). Inténtalo más tarde.', 'err');
    }
  }
</script>
</body>
</html>
