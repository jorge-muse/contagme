<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConTAGme</title>
<meta name="description" content="ConTAGme — Próximamente.">
<link rel="icon" type="image/webp" href="logo.webp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #f5f0e6;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .logo {
    width: 190px;
    height: 190px;
    object-fit: contain;
    margin-bottom: 2.2rem;
  }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.05;
  }
  h1 .tag { color: #d4a72c; }
  .rule {
    width: 84px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d4a72c, transparent);
    margin: 1.8rem auto;
  }
  .soon {
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #e8dcc0;
  }
  .soon-sub {
    margin-top: 0.7rem;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #8d8574;
  }
  footer {
    position: absolute;
    bottom: 1.6rem;
    font-size: 0.8rem;
    color: #6b6558;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <img class="logo" src="logo.webp" alt="ConTAGme">
  <h1>Con<span class="tag">TAG</span>me</h1>
  <div class="rule"></div>
  <p class="soon">Próximamente</p>
  <p class="soon-sub">Coming Soon</p>
  <footer>© 2026 ConTAGme · contagme.app</footer>
</body>
</html>
